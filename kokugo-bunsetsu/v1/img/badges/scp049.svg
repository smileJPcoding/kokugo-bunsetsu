<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景（深い闇と怪しい霧） -->
  <rect width="300" height="300" fill="#0b0e0c"/>
  <circle cx="150" cy="150" r="130" fill="#131c15" opacity="0.4"/>

  <!-- ローブ・体 -->
  <g id="body">
    <!-- 肩 -->
    <path d="M40 300 C60 220 90 170 120 160 C110 180 80 240 40 300 Z" fill="#141414"/>
    <path d="M260 300 C240 220 210 170 180 160 C190 180 220 240 260 300 Z" fill="#0a0a0a"/>
    <!-- 胸元 -->
    <path d="M120 160 C130 175 170 175 180 160 C165 200 160 280 150 300 C140 280 135 200 120 160 Z" fill="#111111"/>
    <!-- 奥のフード -->
    <path d="M80 140 C70 90 90 40 150 40 C210 40 230 90 220 140 C200 100 180 75 150 75 C120 75 100 100 80 140 Z" fill="#0d0d0d"/>
  </g>

  <!-- ペスト医師のマスク -->
  <g id="mask">
    <!-- マスクのベース -->
    <ellipse cx="150" cy="120" rx="45" ry="40" fill="#cfc6b4" stroke="#4a4031" stroke-width="1.5"/>
    <path d="M107 130 C110 90 130 75 150 75 C170 75 190 90 193 130 C190 155 175 170 165 175 C155 180 145 180 135 175 C125 170 110 155 107 130 Z" fill="#cfc6b4"/>
    
    <!-- クチバシ（リアルな曲線の造形） -->
    <path d="M128 165 C132 175 138 215 141 245 C143 258 145 265 150 265 C155 265 157 258 159 245 C162 215 168 175 172 165 C150 175 150 175 128 165 Z" fill="#b0a694"/>
    <!-- クチバシの影（立体感） -->
    <path d="M150 75 C150 175 150 175 150 265 C155 265 157 258 159 245 C162 215 168 175 172 165 C150 175 150 175 150 75 Z" fill="#000000" opacity="0.15"/>
    
    <!-- 革のステッチ（縫い目） -->
    <path d="M150 75 L150 170" stroke="#544c3d" stroke-width="1.5" stroke-dasharray="3,3"/>
    <path d="M117 145 C125 155 138 162 150 163" fill="none" stroke="#544c3d" stroke-width="1" stroke-dasharray="2,2"/>
    <path d="M183 145 C175 155 162 162 150 163" fill="none" stroke="#544c3d" stroke-width="1" stroke-dasharray="2,2"/>

    <!-- 呼吸穴 -->
    <circle cx="141" cy="190" r="1.5" fill="#2b251a"/>
    <circle cx="142" cy="200" r="1.5" fill="#2b251a"/>
    <circle cx="143" cy="210" r="1.5" fill="#2b251a"/>
    <circle cx="159" cy="190" r="1.5" fill="#2b251a"/>
    <circle cx="158" cy="200" r="1.5" fill="#2b251a"/>
    <circle cx="157" cy="210" r="1.5" fill="#2b251a"/>
  </g>

  <!-- 目のゴーグルパーツ（怪しく光る赤眼） -->
  <g id="eyes">
    <!-- 左目 -->
    <circle cx="128" cy="120" r="14" fill="#121212" stroke="#4a4031" stroke-width="2.5"/>
    <circle cx="128" cy="120" r="8" fill="#ff2222"/>
    <circle cx="128" cy="120" r="3" fill="#660000"/>
    <circle cx="130" cy="118" r="1.8" fill="#ffffff" opacity="0.8"/>
    
    <!-- 右目 -->
    <circle cx="172" cy="120" r="14" fill="#121212" stroke="#4a4031" stroke-width="2.5"/>
    <circle cx="172" cy="120" r="8" fill="#ff2222"/>
    <circle cx="172" cy="120" r="3" fill="#660000"/>
    <circle cx="170" cy="118" r="1.8" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- 手前の大きなフード（マスクを覆う襟の影） -->
  <path d="M80 140 C70 90 90 40 150 40 C210 40 230 90 220 140 C205 105 185 85 150 85 C115 85 95 105 80 140 Z" fill="#1c1c1c"/>
</svg>
